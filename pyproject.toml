[project]
name = "sqlit"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "textual[syntax]>=6.10.0",
  "textual-fastdatatable==0.19.0",
  "pyperclip>=1.8.2",
  "keyring>=24.0.0",
  "docker>=7.0.0",
  "sqlparse>=0.5.0",
  "mssql-python>=1.1.0",
  "dataclass-wizard>=1.0.0",
]

[project.scripts]
sqlit = "sqlit.cli:main"
goose = "goose.worker:main"
gen = "lsp_code_gen.generator:main"


[tool.uv]
package = true

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.32.5",
]
